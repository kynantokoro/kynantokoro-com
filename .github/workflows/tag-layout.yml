name: Regenerate tag layout

# Regenerates packages/website/app/data/tag-layout.json (the semantic clustering
# behind the Tag Search bubble map). The script only calls Claude when the *set*
# of tags changed (hash mismatch) or when forced; the result is proposed as a
# pull request (never pushed straight to main). Counts/bubble sizes are computed
# at runtime, so day-to-day posting does not trigger a regeneration.
#
# Required configuration:
#   vars.SANITY_STUDIO_PROJECT_ID, vars.SANITY_STUDIO_DATASET  (existing)
#   secrets.SANITY_TOKEN        (read token; optional for published-only datasets)
#   secrets.ANTHROPIC_API_KEY   (used only when the tag set changed or forced)
#   Repo setting: Settings → Actions → General → Workflow permissions →
#     enable "Allow GitHub Actions to create and approve pull requests".

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force regeneration even if the tag set is unchanged (replaces the manual seed with a Claude-generated layout)'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run: print the generated layout in the logs and open no PR'
        type: boolean
        default: false
  schedule:
    - cron: '0 18 * * *' # daily
  repository_dispatch:
    types: [sanity-content-changed]

concurrency:
  group: tag-layout
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Regenerate tag layout
        run: pnpm --filter website exec tsx scripts/generate-tag-layout.ts
        env:
          SANITY_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
          SANITY_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAG_LAYOUT_FORCE: ${{ inputs.force }}
          TAG_LAYOUT_DRY_RUN: ${{ inputs.dry_run }}

      - name: Open PR if changed
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: packages/website/app/data/tag-layout.json
          base: main
          branch: chore/tag-layout
          delete-branch: true
          commit-message: 'chore: regenerate tag-layout.json'
          title: 'chore: regenerate tag-layout.json'
          body: |
            Automated semantic tag-layout regeneration for the Tag Search bubble map.

            Triggered by the **Regenerate tag layout** workflow (the tag set changed, or `force` was set).
            Counts/bubble sizes are computed at runtime — this only updates which cluster each tag belongs to.
